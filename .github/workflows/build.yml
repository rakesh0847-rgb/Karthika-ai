name: Karthika AI Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Platforms
        run: flutter create --platforms=android,web .

      - name: Configure Android local notifications
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          if "android.permission.RECEIVE_BOOT_COMPLETED" not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application',
                  1
              )

          receivers = """
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          """
          if "ScheduledNotificationReceiver" not in text:
              text = text.replace("</application>", receivers + "\n    </application>")
          manifest.write_text(text)

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Android Gradle Kotlin file not found")

          g = gradle.read_text()

          if "isCoreLibraryDesugaringEnabled" in g:
              g = re.sub(
                  r"isCoreLibraryDesugaringEnabled\s*=\s*(true|false)",
                  "isCoreLibraryDesugaringEnabled = true",
                  g
              )
          else:
              g = g.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          if "coreLibraryDesugaring(" not in g:
              g = g.replace(
                  "dependencies {",
                  'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                  1
              )

          gradle.write_text(g)
          PY

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Web App
        run: flutter build web --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORMA-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web App
        uses: actions/upload-artifact@v4
        with:
          name: ORMA-Web
          path: build/web/
