name: karthika_ai
description: ORMA Personal Reminder Assistant
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/karthika.jpg
    - assets/orma_logo.png
    - assets/emi.jpg.PNG
    - assets/loan.jpg.PNG
    - assets/chitty.jpg.PNG
    - assets/electricity.jpg.PNG
    - assets/water.jpg.PNG
    - assets/insurance.jpg.PNG
    - assets/rent.jpg.PNG
    - assets/other.jpg.PNG

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/orma_logo.png
  adaptive_icon_background: "#FFFFFAF6"
  adaptive_icon_foreground: assets/orma_logo.png
